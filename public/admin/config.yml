# Admin-Bereich (Decap CMS). Anmeldung mit dem GitHub-Konto (über /api/auth, Cloudflare Pages Function).
# Entwurfsmodus: «Speichern» legt nur einen Entwurf an (eigener Zweig auf GitHub, nichts geht online).
# Erst «Veröffentlichen» übernimmt den Eintrag auf main, dann baut Cloudflare die Seite neu (etwa eine Minute).
# Löschen löst keinen eigenen Build aus ([skip ci]): Gelöschtes verschwindet von der Seite beim nächsten Veröffentlichen.
backend:
  name: github
  repo: marcwenger89/mw-wildlifeart
  branch: main
  base_url: https://www.mw-wildlifeart.ch
  auth_endpoint: api/auth
  squash_merges: true
  commit_messages:
    create: 'Neu: {{collection}} «{{slug}}»'
    update: 'Geändert: {{collection}} «{{slug}}»'
    delete: 'Gelöscht: {{collection}} «{{slug}}» [skip ci]'
    uploadMedia: 'Bild hochgeladen: {{path}}'
    deleteMedia: 'Bild gelöscht: {{path}} [skip ci]'

publish_mode: editorial_workflow

locale: de
site_url: https://mw-wildlifeart.ch
display_url: https://mw-wildlifeart.ch
logo_url: /logo/logo-schwarz.png

# Bilder als Web-Version hochladen (lange Seite etwa 2000 px, JPG)
media_folder: public/bilder
public_folder: /bilder

collections:
  - name: fotos
    label: Fotos
    label_singular: Foto
    folder: src/content/fotos
    create: true
    identifier_field: titel
    slug: '{{slug}}'
    summary: '{{titel}} · {{serie}}'
    sortable_fields: [hochgeladen, titel, serie]
    view_groups:
      - { label: Galerie, field: serie }
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: serie, label: Galerie, widget: relation, collection: serien, search_fields: [titel], value_field: '{{slug}}', display_fields: [titel] }
      - { name: bild, label: Bild, widget: image, hint: 'Web-Version, lange Seite etwa 2000 px' }
      - { name: ort, label: Ort, widget: string, required: false, hint: 'z. B. Vallée de Joux VD' }
      - { name: koordinaten, label: Koordinaten, widget: string, required: false, hint: 'z. B. 46.62° N, 6.27° E. Leer lassen, wenn der Ort geheim bleiben soll.' }
      - { name: monat, label: Monat, widget: string, required: false }
      - { name: kamera, label: Kamera, widget: string, required: false, hint: 'freiwillig, z. B. Z9' }
      - { name: brennweite, label: Brennweite (mm), widget: string, required: false, hint: 'nur die Zahl, z. B. 800 – «mm» setzt die Seite automatisch' }
      - { name: blende, label: Blende (f/), widget: string, required: false, hint: 'nur die Zahl, z. B. 6.3 – «f/» setzt die Seite automatisch' }
      - { name: belichtung, label: Belichtungszeit (1/ s), widget: string, required: false, hint: 'nur die Zahl, z. B. 1000 für 1/1000 s – «1/» setzt die Seite automatisch' }
      - { name: iso, label: ISO, widget: string, required: false, hint: 'nur die Zahl, z. B. 800' }
      - { name: saal_link, label: Saal-Link für dieses Bild, widget: string, required: false, hint: 'Leer lassen, dann gilt der Saal-Link der Galerie.' }
      - { name: tags, label: Tags, widget: relation, collection: seite, file: tags, search_fields: ['tags.*'], value_field: 'tags.*', display_fields: ['tags.*'], multiple: true, required: false, hint: 'Zum Filtern unter «Alle Bilder». Neue Tags legst du unter Seitentexte → Tags an.' }
      - { name: startseite, label: Auf der Startseite zeigen (grosses Bild oben), widget: boolean, default: false }
      - name: ausschnitt
        label: 'Startseite: Bildausschnitt'
        widget: select
        required: false
        default: center
        hint: 'Nur wenn das Bild auf der Startseite ist. Das Titelbild füllt den ganzen Bildschirm und schneidet dein Foto zu. Hier wählst du, welcher Teil sichtbar bleibt.'
        options:
          - { label: Mitte, value: center }
          - { label: Oben, value: 'center top' }
          - { label: Unten, value: 'center bottom' }
          - { label: Links, value: 'left center' }
          - { label: Rechts, value: 'right center' }
          - { label: Oben links, value: 'left top' }
          - { label: Oben rechts, value: 'right top' }
          - { label: Unten links, value: 'left bottom' }
          - { label: Unten rechts, value: 'right bottom' }
      - { name: startbild, label: 'Startseite: eigener Zuschnitt PC (optional)', widget: image, required: false, hint: 'Querformat 16:9, z. B. 2400 × 1350 px. Füllt oben auf der Startseite den ganzen Bildschirm, der Text steht darüber (oben ruhige, dunkle Fläche lassen).' }
      - { name: startbild_handy, label: 'Startseite: eigener Zuschnitt Handy (optional)', widget: image, required: false, hint: 'Hochformat 9:16, z. B. 1080 × 1920 px. Leer = Handy schneidet die Mitte aus dem PC-Bild bzw. dem Foto.' }
      - { name: werk, label: 'Startseite: bei «Begegnungen» zeigen (6 Bilder)', widget: boolean, default: false, hint: 'Angehakte Fotos stehen zuerst (neuestes zuerst). Sind weniger als 6 angehakt, wird mit den neuesten Fotos aufgefüllt.' }
      - { name: werkbild, label: 'Begegnungen: eigener Zuschnitt (optional)', widget: image, required: false, hint: 'Querformat 3:2, z. B. 1800 × 1200 px. Gilt für PC und Handy. Leer = das Foto wird mittig auf 3:2 zugeschnitten.' }
      - { name: hochgeladen, label: Hochgeladen am, widget: datetime, format: 'YYYY-MM-DDTHH:mm', date_format: 'DD.MM.YYYY', time_format: 'HH:mm', required: false, hint: 'Wird beim Erstellen automatisch gesetzt. Das neueste Foto steht in der Galerie zuerst. Nur ändern, wenn ein Bild weiter nach vorne oder hinten soll.' }
      - { name: body, label: Geschichte zum Bild, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [] }

  - name: serien
    label: Galerien
    label_singular: Galerie
    folder: src/content/serien
    create: true
    identifier_field: titel
    slug: '{{slug}}'
    summary: '{{titel}}'
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: kurztext, label: Kurztext, widget: text, required: false }
      - { name: titelbild, label: Titelbild (hochformatig), widget: image }
      - { name: saal_link, label: Link zur Saal-Galerie, widget: string, required: false }
      - { name: reihenfolge, label: Reihenfolge, widget: number, value_type: int, default: 100, hint: 'Kleinere Zahl kommt zuerst.' }
      - { name: startseite, label: Auf der Startseite zeigen, widget: boolean, default: false, hint: 'Auf der Startseite stehen höchstens 4 Galerien. Ist keine angehakt, erscheinen die ersten 4 nach Reihenfolge. Hat es mehr, erscheint der Knopf «Alle Galerien».' }

  - name: blog
    label: Blog
    label_singular: Beitrag
    folder: src/content/blog
    create: true
    identifier_field: titel
    slug: '{{slug}}'
    summary: '{{titel}} ({{datum}})'
    sortable_fields: [datum, titel]
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: datum, label: Datum, widget: datetime, date_format: 'DD.MM.YYYY', time_format: false, format: 'YYYY-MM-DD', picker_utc: true }
      - { name: bild, label: Titelbild, widget: image, required: false }
      - { name: kurztext, label: Kurztext für die Übersicht, widget: text }
      - { name: entwurf, label: Entwurf (noch nicht anzeigen), widget: boolean, default: false }
      - { name: kopfbild, label: Titelbild oben im Beitrag zeigen, widget: boolean, default: true, hint: 'Aus = Titelbild nur in der Blog-Übersicht.' }
      - { name: body, label: Text, widget: markdown, required: false }
      - name: abschnitte
        label: Abschnitte mit Bildern daneben
        label_singular: Abschnitt
        widget: list
        required: false
        summary: '{{fields.text}}'
        hint: 'Erscheinen nach dem Text. Bilder stehen neben dem Abschnitt, auf dem Handy darunter (schmale Bildspalte: darüber).'
        fields:
          - { name: text, label: Text, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, bulleted-list], editor_components: [], hint: 'Mehrmals Enter = mehr Abstand (jede leere Zeile wird übernommen). Leer lassen für nur Bilder.' }
          - name: schrift
            label: Schriftart des Textes
            widget: select
            required: false
            default: standard
            options:
              - { label: 'Standard (Karla, wie heute)', value: standard }
              - { label: 'Titelschrift (Fraunces)', value: titel }
              - { label: 'Titelschrift kursiv (Fraunces)', value: kursiv }
              - { label: 'Schreibmaschine (IBM Plex Mono)', value: mono }
          - name: farbe
            label: Textfarbe
            widget: select
            required: false
            default: standard
            options:
              - { label: 'Standard (hellgrau, wie heute)', value: standard }
              - { label: 'Hell (fast weiss)', value: hell }
              - { label: 'Gold (wie die Akzente)', value: gold }
              - { label: 'Sand', value: sand }
              - { label: 'Gedämpft (dunkleres Grau)', value: gedaempft }
          - { name: bildbreite, label: 'Breite der Bilder in % (15–100)', widget: number, value_type: int, min: 15, max: 100, step: 5, default: 50, required: false, hint: 'Neben dem Text: z.B. 25 für ein kleines Porträt, 50 für halb/halb (über 75 wird es eng). Unter dem Text: Breite des Bildblocks, 100 = ganze Breite.' }
          - name: bildseite
            label: Wo stehen die Bilder
            widget: select
            required: false
            default: rechts
            options: [{ label: Rechts neben dem Text, value: rechts }, { label: Links neben dem Text, value: links }, { label: Unter dem Text, value: unten }]
          - name: bildhoehe
            label: Höhe des Bildes neben dem Text
            widget: select
            required: false
            default: format
            options: [{ label: 'Nach gewähltem Format', value: format }, { label: 'Genau so hoch wie der Text (Bild wird passend zugeschnitten)', value: text }]
            hint: 'Nur für Bilder rechts oder links. Bei «so hoch wie der Text» zeigt der PC das erste Bild über die ganze Texthöhe, auf dem Handy bleibt das Format.'
          - name: bilder
            label: Bilder
            label_singular: Bild
            widget: list
            required: false
            hint: 'Reihenfolge per Ziehen ändern.'
            fields:
              - { name: bild, label: Bild, widget: image }
              - name: format
                label: Format
                widget: select
                required: false
                default: quer
                options:
                  - { label: 'Querformat 3:2 (z.B. 1800 × 1200 px)', value: quer }
                  - { label: 'Hochformat 4:5 (z.B. 800 × 1000 px)', value: hoch }
                  - { label: 'Quadrat 1:1 (z.B. 1200 × 1200 px)', value: quadrat }
                  - { label: 'Breitbild 16:9 (z.B. 1920 × 1080 px)', value: breit }
                  - { label: 'Original (nicht zuschneiden)', value: original }
              - name: breite
                label: Breite in der Bildspalte
                widget: select
                required: false
                default: voll
                options: [{ label: 'Ganze Breite', value: voll }, { label: 'Halbe Breite (zwei nebeneinander)', value: halb }]
              - { name: alt, label: 'Bildbeschreibung (für Suchmaschinen und Screenreader)', widget: string, required: false }

  - name: shop
    label: Shop
    label_singular: Produkt
    folder: src/content/shop
    create: true
    identifier_field: titel
    slug: '{{slug}}'
    summary: '{{titel}}'
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: beschreibung, label: Beschreibung, widget: text }
      - { name: bild, label: Bild, widget: image }
      - name: angaben
        label: Angaben
        label_singular: Angabe
        widget: list
        summary: '{{bezeichnung}}: {{wert}}'
        fields:
          - { name: bezeichnung, label: Bezeichnung, widget: string, hint: 'z. B. Formate oder ab' }
          - { name: wert, label: Wert, widget: string, hint: 'z. B. CHF 45.–' }
      - { name: knopf_text, label: Text auf dem Knopf, widget: string, default: 'Bei Saal Digital ansehen' }
      - { name: saal_link, label: Link zu Saal Digital, widget: string }
      - { name: reihenfolge, label: Reihenfolge, widget: number, value_type: int, default: 100 }

  - name: seite
    label: Seitentexte
    files:
      - name: tags
        label: Tags (Auswahl für die Fotos)
        file: src/data/tags.json
        fields:
          - { name: tags, label: Tags, label_singular: Tag, widget: list, field: { name: tag, label: Tag, widget: string }, hint: 'z. B. Tierarten. Was hier steht, kannst du bei jedem Foto auswählen. Auf der Seite erscheinen nur Tags, die mindestens ein Foto hat.' }
      - name: einstellungen
        label: Startseite, Über mich und Kontakt
        file: src/data/einstellungen.json
        fields:
          - { name: seitenname, label: Name der Seite, widget: string }
          - { name: beschreibung, label: Beschreibung für Suchmaschinen, widget: text }
          - { name: instagram, label: Instagram-Link, widget: string, required: false, hint: 'Farbiges Symbol rechts im Menü und Hinweis unter dem Kontaktformular. Leer lassen = beides weg.' }
          - name: startseite
            label: Startseite
            widget: object
            fields:
              - { name: titel, label: 'Titel (Anfang)', widget: string }
              - { name: titel_betont, label: 'Titel (betontes Wort, in Gold)', widget: string, required: false }
              - { name: titel_ende, label: 'Titel (Ende)', widget: string, required: false }
              - { name: text, label: Einleitung, widget: text }
              - { name: werke_titel, label: 'Titel Bilder-Bereich (6 Bilder)', widget: string, required: false, default: 'Begegnungen' }
              - { name: werke_knopf, label: 'Text des Knopfs darunter', widget: string, required: false, default: 'Alle Galerien' }
              - { name: serien_titel, label: 'Titel der Galerie-Übersicht', widget: string, hint: 'Überschrift auf der Seite mit allen Galerien (z. B. «Lebensräume»).' }
              - { name: shop_titel, label: Titel Shop-Bereich, widget: string }
              - { name: shop_text, label: Text Shop-Bereich, widget: text }
          - name: ueber_mich
            label: Über mich
            widget: object
            fields:
              - { name: titel, label: Titel, widget: string }
              - { name: text, label: 'Text (Leerzeile = neuer Absatz)', widget: text }
              - { name: bild, label: Porträt, widget: image, required: false }
              - { name: link, label: 'Link des Knopfs (leer = kein Knopf)', widget: string, required: false, hint: 'z.B. /blog/hinter-der-kamera/' }
              - { name: knopf_text, label: Text des Knopfs, widget: string, required: false, default: 'Mehr über mich' }
          - name: kontakt
            label: Kontakt
            widget: object
            fields:
              - { name: titel, label: Titel, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: web3forms_schluessel, label: 'Web3Forms-Schlüssel (Access Key)', widget: string, required: false, hint: 'Von web3forms.com. Damit kommen Nachrichten direkt in dein Postfach.' }
          - name: karte
            label: 'Digitale Visitenkarte (nur per QR-Code erreichbar: mw-wildlifeart.ch/qrkarte/)'
            widget: object
            fields:
              - { name: rolle, label: Berufsbezeichnung, widget: string, default: Naturfotograf }
              - { name: email, label: E-Mail, widget: string }
              - { name: telefon, label: 'Telefon (z. B. +41 79 123 45 67; leer = kein Telefon-Knopf)', widget: string, required: false }
          - name: shop
            label: Shop und Kaufen-Knöpfe
            widget: object
            fields:
              - { name: aktiv, label: 'Eingeschaltet (Shop im Menü und auf der Startseite, Knopf «Als Print kaufen» bei den Fotos)', widget: boolean, default: false, hint: 'Erst einschalten, wenn die Saal-Galerien bereit sind.' }
          - { name: saal_hinweis, label: Hinweis unter dem Shop, widget: text }
          - name: baustelle
            label: '«Bald hier»-Seite (Work in progress)'
            widget: object
            fields:
              - { name: aktiv, label: 'Eingeschaltet (Besucher sehen nur diese Seite)', widget: boolean, hint: 'Du selbst siehst die echte Seite über mw-wildlifeart.ch/vorschau/' }
              - { name: eyebrow, label: Kleine Zeile oben, widget: string }
              - { name: titel, label: Titel, widget: string }
              - { name: text, label: 'Text (Leerzeile = neuer Absatz)', widget: text }
      - name: impressum
        label: Impressum
        file: src/content/seiten/impressum.md
        fields:
          - { name: titel, label: Titel, widget: string }
          - { name: body, label: Text, widget: markdown }
      - name: datenschutz
        label: Datenschutz
        file: src/content/seiten/datenschutz.md
        fields:
          - { name: titel, label: Titel, widget: string }
          - { name: body, label: Text, widget: markdown }
