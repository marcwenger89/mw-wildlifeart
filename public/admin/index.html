<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin · MW-Wildlifeart</title>
  <style>
    #alle-veroeffentlichen {
      position: fixed; right: 16px; bottom: 16px; z-index: 9999;
      padding: 10px 16px; border: 0; border-radius: 6px;
      background: #3a69c7; color: #fff; font: 600 14px/1.2 system-ui, sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer;
    }
    #alle-veroeffentlichen:disabled { background: #8a93a6; cursor: wait; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"></script>
  <script>
    // Knopf «Alle abgeschlossenen Entwürfe veröffentlichen»: übernimmt alle Entwürfe in der Spalte «Abgeschlossen»
    // zusammen als einen einzigen Commit auf main. Ein Commit = ein Push = ein Build bei Cloudflare.
    (function () {
      var REPO = 'marcwenger89/mw-wildlifeart';
      var API = 'https://api.github.com/repos/' + REPO;
      var LABEL = 'decap-cms/pending_publish';

      function token() {
        try { return JSON.parse(localStorage.getItem('decap-cms-user') || '{}').token; } catch (e) { return null; }
      }

      async function gh(pfad, optionen) {
        optionen = optionen || {};
        optionen.headers = { Authorization: 'token ' + token(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
        var res = await fetch(API + pfad, optionen);
        if (!res.ok) throw new Error('GitHub meldet einen Fehler (' + res.status + ' bei ' + pfad + ').');
        return res.status === 204 ? null : res.json();
      }

      function json(methode, daten) { return { method: methode, body: JSON.stringify(daten) }; }

      async function bereiteEntwuerfe() {
        var prs = await gh('/pulls?state=open&base=main&per_page=100');
        return prs
          .filter(function (pr) {
            return pr.head.ref.indexOf('cms/') === 0 && pr.labels.some(function (l) { return l.name === LABEL; });
          })
          .sort(function (a, b) { return a.number - b.number; });
      }

      async function dateienVon(pr) {
        var alle = [];
        for (var seite = 1; seite <= 10; seite++) {
          var teil = await gh('/pulls/' + pr.number + '/files?per_page=100&page=' + seite);
          alle = alle.concat(teil);
          if (teil.length < 100) break;
        }
        return alle;
      }

      async function veroeffentlichen(knopf) {
        if (!token()) { alert('Bitte zuerst anmelden.'); return; }
        knopf.disabled = true;
        knopf.textContent = 'Suche Entwürfe …';
        try {
          var prs = await bereiteEntwuerfe();
          if (!prs.length) {
            alert('In der Spalte «Abgeschlossen» liegt kein Entwurf. Zieh die Karten im «Arbeitsablauf» zuerst nach «Abgeschlossen».');
            return;
          }
          var liste = prs.map(function (pr) { return '• ' + pr.title; }).join('\n');
          if (!confirm(prs.length + ' Entwürfe veröffentlichen? Das kostet einen Build.\n\n' + liste)) return;

          knopf.textContent = 'Veröffentliche …';
          // Alle Änderungen der Entwürfe in einem Dateibaum sammeln (bei gleicher Datei gewinnt der neuere Entwurf)
          var eintraege = {};
          for (var i = 0; i < prs.length; i++) {
            var dateien = await dateienVon(prs[i]);
            dateien.forEach(function (d) {
              if (d.status === 'renamed' && d.previous_filename) {
                eintraege[d.previous_filename] = { path: d.previous_filename, mode: '100644', type: 'blob', sha: null };
              }
              eintraege[d.filename] = { path: d.filename, mode: '100644', type: 'blob', sha: d.status === 'removed' ? null : d.sha };
            });
          }

          var main = await gh('/git/ref/heads/main');
          var basis = await gh('/git/commits/' + main.object.sha);
          var baum = await gh('/git/trees', json('POST', { base_tree: basis.tree.sha, tree: Object.values(eintraege) }));
          var nachricht = 'Veröffentlicht: ' + prs.length + ' Entwürfe\n\n' + liste;
          var commit = await gh('/git/commits', json('POST', { message: nachricht, tree: baum.sha, parents: [main.object.sha] }));
          await gh('/git/refs/heads/main', json('PATCH', { sha: commit.sha, force: false }));

          // Entwürfe sind jetzt auf main: Anfragen schliessen und Entwurf-Zweige löschen
          for (var j = 0; j < prs.length; j++) {
            try {
              await gh('/pulls/' + prs[j].number, json('PATCH', { state: 'closed' }));
              await gh('/git/refs/heads/' + prs[j].head.ref.split('/').map(encodeURIComponent).join('/'), { method: 'DELETE' });
            } catch (e) { /* Aufräumen ist nicht kritisch */ }
          }
          alert('Fertig. Die Seite ist in etwa einer Minute online aktualisiert.');
          location.reload();
        } catch (e) {
          alert(e.message + '\n\nEs wurde nichts veröffentlicht. Einfach nochmals versuchen.');
        } finally {
          knopf.disabled = false;
          knopf.textContent = 'Alle abgeschlossenen Entwürfe veröffentlichen';
        }
      }

      function knopfZeigen() {
        var knopf = document.getElementById('alle-veroeffentlichen');
        if (!token()) { if (knopf) knopf.remove(); return; }
        if (knopf) return;
        knopf = document.createElement('button');
        knopf.id = 'alle-veroeffentlichen';
        knopf.type = 'button';
        knopf.textContent = 'Alle abgeschlossenen Entwürfe veröffentlichen';
        knopf.addEventListener('click', function () { veroeffentlichen(knopf); });
        document.body.appendChild(knopf);
      }

      setInterval(knopfZeigen, 1000);
    })();
  </script>
</body>
</html>
